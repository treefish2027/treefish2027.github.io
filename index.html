<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Treefish · 个人创作网站</title>
  <style>
    * { box-sizing: border-box; }
    body {
      margin: 0;
      background: #f6f5ef;
      color: #233b33;
      font-family: "Microsoft YaHei", sans-serif;
      line-height: 1.8;
    }
    main {
      max-width: 960px;
      margin: auto;
      padding: 70px 24px;
    }
    .label {
      color: #597568;
      font-size: 13px;
      letter-spacing: 3px;
    }
    h1 {
      margin: 24px 0 12px;
      font-family: Georgia, serif;
      font-size: clamp(56px, 12vw, 100px);
      font-weight: normal;
      line-height: 1.2;
    }
    .intro { color: #597568; }
    .works {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 18px;
      margin-top: 55px;
    }
    article {
      padding: 28px;
      background: #fffef9;
      border: 1px solid #dce3d9;
      border-radius: 16px;
    }
    article h2 { margin: 0 0 10px; font-size: 21px; }
    article p { margin: 0; color: #64756b; }
    footer {
      margin-top: 60px;
      color: #64756b;
      font-size: 13px;
    }
    @media (max-width: 560px) {
      main { padding-top: 45px; }
      .works { grid-template-columns: 1fr; }
    }
  </style>
</head>
<body>
  <main>
    <p class="label">STORIES & ART</p>
    <h1>Treefish.</h1>
    <p class="intro">欢迎来到我的创作空间。<br>
      这里将收录我的文字、漫画与插画。</p>

    <section class="works" aria-label="作品栏目">
      <article>
        <h2>原创小说</h2>
        <p>作品整理中，敬请期待。</p>
      </article>
      <article>
        <h2>漫画</h2>
        <p>作品整理中，敬请期待。</p>
      </article>
      <article>
        <h2>插画</h2>
        <p>作品整理中，敬请期待。</p>
      </article>
      <article>
        <h2>同人创作</h2>
        <p>作品整理中，敬请期待。</p>
      </article>
    </section>

    <footer>© 2026 Treefish</footer>
  </main>
</body>
</html>
